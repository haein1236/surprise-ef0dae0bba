<!DOCTYPE html>
<html lang="fr"><!-- page en français -->
<head>
  <meta charset="utf-8"><!-- encodage -->
  <meta name="viewport" content="width=device-width, initial-scale=1"><!-- rendu mobile -->
  <meta name="robots" content="noindex, nofollow"><!-- pas d'indexation -->
  <title>QR cœur ♡</title><!-- titre de l'onglet -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Great+Vibes&display=swap"><!-- polices -->
  <style>
    :root { --cream: #fbf1de; --pink: #f9a8c4; --brown: #6b4a3a; --green: #8db474; } /* couleurs */
    * { box-sizing: border-box; }                                                     /* tailles prévisibles */
    body { margin: 0; min-height: 100vh; font-family: Nunito, system-ui, sans-serif; color: var(--brown); background: #ffd6e6; padding: 24px 16px; } /* page rose */
    .card { max-width: 560px; margin: 0 auto; background: var(--cream); border: 2px solid var(--brown); border-radius: 16px; padding: 22px; box-shadow: 0 6px 0 rgba(107,74,58,.2); } /* carte */
    h1 { font: 400 2.6rem/1 'Great Vibes', cursive; color: #b3262e; margin: 0 0 16px; text-align: center; } /* titre */
    label { display: block; font-weight: 700; margin: 10px 0 6px; }                   /* libellés */
    input[type=url] { width: 100%; font: 16px Nunito, sans-serif; padding: 12px; border: 2px solid var(--brown); border-radius: 10px; background: #fff; } /* champ URL (16 px = pas de zoom iOS) */
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 8px 0; } /* rangée d'options */
    .row label { margin: 0; font-weight: 400; display: flex; flex-direction: column; gap: 4px; } /* option */
    select, input[type=color] { min-height: 44px; font: 16px Nunito, sans-serif; border: 2px solid var(--brown); border-radius: 10px; background: #fff; } /* contrôles */
    .check { flex-direction: row !important; align-items: center; min-height: 44px; } /* case à cocher */
    button { min-height: 48px; padding: 10px 22px; border: 2px solid var(--brown); border-radius: 999px; background: var(--pink); color: var(--brown); font: 700 1rem Nunito, sans-serif; box-shadow: 0 4px 0 var(--brown); cursor: pointer; } /* boutons */
    button:disabled { opacity: .45; cursor: not-allowed; }                             /* bouton inactif */
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px dashed #b3262e; outline-offset: 3px; } /* focus clavier */
    #gen { width: 100%; margin-top: 12px; background: #b9d99b; }                      /* bouton Générer */
    .preview { margin: 16px auto; width: min(100%, 420px); aspect-ratio: 1; border-radius: 12px; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/20px 20px; border: 2px dashed rgba(107,74,58,.3); } /* damier = transparence visible */
    canvas { width: 100%; height: 100%; display: block; }                             /* aperçu */
    #status { font-weight: 800; font-size: 1.1rem; text-align: center; min-height: 1.5em; margin: 12px 0 0; } /* verdict */
    #info { text-align: center; font-size: .9rem; opacity: .8; margin: 0 0 8px; }     /* détails */
    .help { background: #fff; border: 2px solid var(--brown); border-radius: 12px; padding: 12px; font-weight: 700; text-align: center; } /* rappel */
  </style>
</head>
<body>
  <main class="card"><!-- carte principale -->
    <h1>QR code en cœur ♡</h1><!-- titre -->
    <form id="form" novalidate><!-- formulaire (Entrée = Générer) -->
      <label for="url">URL du site</label><!-- libellé -->
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://ton-pseudo.github.io/nom-secret/"><!-- adresse du site en ligne -->
      <div class="row"><!-- options -->
        <label>Couleur des points <input type="color" id="dot" value="#d6457e"></label><!-- couleur des points (rose foncé = bien lisible) -->
        <label>Fond <select id="bg"><option value="white">Blanc</option><option value="transparent">Transparent</option></select></label><!-- fond -->
        <label>Taille <select id="size"><option value="512">512 px</option><option value="1024" selected>1024 px</option><option value="2048">2048 px</option></select></label><!-- taille d'export -->
        <label class="check"><input type="checkbox" id="decor" checked> Points décoratifs</label><!-- remplir le cœur de points -->
        <label>Photo au centre (facultatif) <input type="file" id="centerImg" accept="image/*"></label><!-- photo du couple découpée en cœur au milieu -->
        <button type="button" id="centerClear" style="min-height:44px;padding:6px 14px;font-size:.9rem" hidden>Retirer la photo</button><!-- revenir au petit cœur noir -->
      </div><!-- fin options -->
      <button id="gen" type="submit">Générer</button><!-- bouton principal -->
    </form><!-- fin formulaire -->
    <p id="status" role="status" aria-live="polite"></p><!-- ✅ / ❌ -->
    <div class="preview"><canvas id="out" width="1024" height="1024" aria-label="QR code en forme de cœur"></canvas></div><!-- aperçu -->
    <p id="info"></p><!-- version, marge, modules retirés -->
    <div class="row" style="justify-content:center"><!-- téléchargements -->
      <button id="png" type="button" disabled>Télécharger PNG</button><!-- export PNG -->
      <button id="svg" type="button" disabled>Télécharger SVG</button><!-- export SVG -->
    </div><!-- fin téléchargements -->
    <p class="help">📱 Teste TOUJOURS le QR avec ton téléphone avant de l'envoyer.</p><!-- rappel obligatoire -->
  </main><!-- fin carte -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';document.head.appendChild(s)"></script><!-- générateur de matrice QR (+ CDN de secours) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><!-- décodeur jsQR pour la vérification -->
  <script>
  (() => {                                                                          // code isolé
    'use strict';                                                                   // mode strict
    const $ = id => document.getElementById(id);                                    // raccourci
    const out = $('out'), status = $('status'), info = $('info');                   // éléments
    const HEART = 'M50 88C20 68 4 50 4 31C4 17 15 7 28 7C38 7 46 13 50 22C54 13 62 7 72 7C85 7 96 17 96 31C96 50 80 68 50 88Z'; // cœur (repère 100)
    const f = v => +v.toFixed(2);                                                   // arrondi pour des chemins compacts
    const probe = document.createElement('canvas').getContext('2d');                // contexte pour tester « point dans le cœur central »
    let model = null, opts = null;                                                  // dernier résultat
    let centerImg = null, centerUrl = "";                                           // photo centrale (image chargée + adresse data: pour le SVG)

    const inHeart = (x, y) => { const a = x * x + y * y - 1; return a * a * a - x * x * y * y * y <= 0; }; // équation du cœur : (x²+y²−1)³ − x²y³ ≤ 0
    function heartD(cx, cy, w) {                                                    // cœur centré en (cx, cy), largeur w
      const s = w / 92; let i = 0;                                                  // échelle (le cœur fait 92 de large)
      return HEART.replace(/-?\d+(\.\d+)?/g, n => (i++ % 2 === 0 ? f(cx + (+n - 50) * s) : f(cy + (+n - 47.5) * s))); // transforme chaque coordonnée
    }                                                                               // fin heartD
    const circ = (x, y, r) => `M${f(x - r)} ${f(y)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0`; // cercle en chemin SVG
    const rr = (x, y, w, h, r) => `M${f(x + r)} ${f(y)}h${f(w - 2 * r)}a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(r)}v${f(h - 2 * r)}a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(r)}h${f(-(w - 2 * r))}a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(-r)}v${f(-(h - 2 * r))}a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(-r)}z`; // carré arrondi
    const hash = (x, y) => { const t = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return t - Math.floor(t); }; // pseudo-hasard stable

    function alignPos(v) {                                                          // positions des motifs d'alignement (algorithme standard)
      if (v === 1) return [];                                                       // version 1 : aucun
      const num = Math.floor(v / 7) + 2, size = v * 4 + 17;                         // nombre + taille
      const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (num * 2 - 2)) * 2;      // espacement
      const res = [6];                                                              // premier à 6
      for (let p = size - 7; res.length < num; p -= step) res.splice(1, 0, p);      // les suivants
      return res;                                                                   // liste
    }                                                                               // fin alignPos

    function build(text, type, padRatio, decor, cw = .16) {                                   // construit le modèle géométrique
      const qr = qrcode(type, 'H');                                                 // correction d'erreur H (≈ 30 %)
      qr.addData(text, 'Byte'); qr.make();                                          // encode
      const n = qr.getModuleCount(), v = (n - 17) / 4;                              // taille + version
      const pad = Math.max(4, Math.round(n * padRatio)), G = n + 2 * pad;           // marge autour (en modules) + grille totale
      const toH = (gx, gy) => [-1.2 + gx / G * 2.4, 1.3 - gy / G * 2.4];            // grille → repère du cœur
      const ox = pad, oy = pad;                                                     // coin du QR dans la grille
      const ap = alignPos(v), hi = ap[ap.length - 1];                               // centres d'alignement + le plus grand
      const skip = (ar, ac) => (ar === 6 && ac === 6) || (ar === 6 && ac === hi) || (ar === hi && ac === 6); // centres qui tombent sur un repère d'angle
      const isAlign = (r, c) => ap.some(ar => ap.some(ac => !skip(ar, ac) && Math.abs(r - ar) <= 2 && Math.abs(c - ac) <= 2)); // dans un motif d'alignement ?
      const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7); // dans un repère d'angle
      const isProt = (r, c) => (r < 9 && c < 9) || (r < 9 && c >= n - 8) || (r >= n - 8 && c < 9) || r === 6 || c === 6 || isAlign(r, c) || (v >= 7 && ((r < 6 && c >= n - 11 && c < n - 8) || (c < 6 && r >= n - 11 && r < n - 8))); // modules vitaux (repères, format, timing, alignement, version)
      const center = { x: ox + n / 2, y: oy + n / 2, w: Math.max(3.2, n * cw) };     // cœur central (noir ou photo), largeur = n × cw modules
      const halo = new Path2D(heartD(center.x, center.y, center.w + 1.6));          // zone libre autour du cœur central
      const dots = [], deco = [];                                                   // points de données / décoratifs
      let dropped = 0, dark = 0;                                                    // statistiques
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {                     // chaque module
        if (isFinder(r, c) || !qr.isDark(r, c)) continue;                           // repères dessinés à part ; clairs = rien
        const gx = ox + c + .5, gy = oy + r + .5;                                   // centre du module
        if (!isProt(r, c)) {                                                        // module de données
          dark++;                                                                   // compte
          const [hx, hy] = toH(gx, gy);                                             // dans le repère du cœur
          if (!inHeart(hx, hy) || probe.isPointInPath(halo, gx, gy)) { dropped++; continue; } // hors du cœur ou sous le cœur central → retiré
        }                                                                           // fin données
        dots.push([gx, gy]);                                                        // point gardé
      }                                                                             // fin modules
      if (decor) {                                                                  // points décoratifs
        const q = 3;                                                                // zone calme autour du QR (modules)
        for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {             // chaque case de la grille
          if (gx >= ox - q && gx < ox + n + q && gy >= oy - q && gy < oy + n + q) continue; // pas près du QR
          const [hx, hy] = toH(gx + .5, gy + .5);                                   // repère cœur
          if (inHeart(hx, hy) && hash(gx, gy) < .5) deco.push([gx + .5, gy + .5]);  // un point sur deux dans le cœur
        }                                                                           // fin grille
      }                                                                             // fin décor
      return { G, n, v, pad, dots, deco, finders: [[ox, oy], [ox + n - 7, oy], [ox, oy + n - 7]], center, drop: dark ? dropped / dark : 0 }; // modèle
    }                                                                               // fin build

    function paths(m, u) {                                                          // modèle → chemins SVG (échelle u px/module)
      return {                                                                      // chemins
        deco: m.deco.map(([x, y]) => circ(x * u, y * u, .3 * u)).join(''),          // petits points décoratifs
        dots: m.dots.map(([x, y]) => circ(x * u, y * u, .44 * u)).join(''),         // points ARRONDIS de données
        rings: m.finders.map(([x, y]) => rr(x * u, y * u, 7 * u, 7 * u, 2 * u) + rr((x + 1) * u, (y + 1) * u, 5 * u, 5 * u, 1.4 * u)).join(''), // anneaux des repères
        cores: m.finders.map(([x, y]) => rr((x + 2) * u, (y + 2) * u, 3 * u, 3 * u, .9 * u)).join(''), // centres des repères
        heart: heartD(m.center.x * u, m.center.y * u, m.center.w * u)               // cœur noir central
      };                                                                            // fin chemins
    }                                                                               // fin paths

    function draw(ctx, m, S, o) {                                                   // dessine le modèle dans un canvas S×S
      const p = paths(m, S / m.G);                                                  // chemins à l'échelle
      ctx.clearRect(0, 0, S, S);                                                    // efface
      if (o.bg === 'white') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S); }   // fond blanc
      ctx.fillStyle = o.dot;                                                        // couleur des points
      ctx.globalAlpha = .42; ctx.fill(new Path2D(p.deco));                          // décor plus léger
      ctx.globalAlpha = 1; ctx.fill(new Path2D(p.dots));                            // données
      ctx.fill(new Path2D(p.rings), 'evenodd');                                     // anneaux (trou au milieu)
      ctx.fill(new Path2D(p.cores));                                                // centres
      if (o.img) {                                                                  // photo au centre
        const u = S / m.G, w = m.center.w * u, sc = w / 92;                         // largeur du cœur en pixels + échelle
        const bx = m.center.x * u - w / 2, by = m.center.y * u - 40.5 * sc, bh = 81 * sc; // boîte englobante du cœur
        const r = Math.max(w / o.img.naturalWidth, bh / o.img.naturalHeight);       // remplissage « cover »
        const iw = o.img.naturalWidth * r, ih = o.img.naturalHeight * r;            // taille de la photo dessinée
        ctx.save(); ctx.clip(new Path2D(p.heart));                                  // découpe en cœur
        ctx.drawImage(o.img, bx + (w - iw) / 2, by + (bh - ih) * .3, iw, ih);       // photo centrée (visages un peu en haut)
        ctx.restore();                                                              // fin découpe
        ctx.lineJoin = 'round';                                                    // coins arrondis
        ctx.lineWidth = u * .9; ctx.strokeStyle = '#fff'; ctx.stroke(new Path2D(p.heart)); // contour blanc
        ctx.lineWidth = u * .35; ctx.strokeStyle = o.dot; ctx.stroke(new Path2D(p.heart)); // liseré rose
      } else {                                                                      // sans photo
        ctx.fillStyle = '#2b1b17'; ctx.fill(new Path2D(p.heart));                   // petit cœur noir
      }                                                                             // fin centre
    }                                                                               // fin draw

    function toSVG(m, S, o) {                                                       // export SVG
      const p = paths(m, S / m.G);                                                  // chemins
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">` + // en-tête
        (o.bg === 'white' ? '<rect width="100%" height="100%" fill="#fff"/>' : '') + // fond
        `<path d="${p.deco}" fill="${o.dot}" fill-opacity=".42"/><path d="${p.dots}" fill="${o.dot}"/>` + // points
        `<path d="${p.rings}" fill="${o.dot}" fill-rule="evenodd"/><path d="${p.cores}" fill="${o.dot}"/>` + // repères
        (o.img ? `<defs><clipPath id="hc"><path d="${p.heart}"/></clipPath></defs><image href="${centerUrl}" x="${f(m.center.x * S / m.G - m.center.w * S / m.G / 2)}" y="${f(m.center.y * S / m.G - 40.5 * m.center.w * S / m.G / 92)}" width="${f(m.center.w * S / m.G)}" height="${f(81 * m.center.w * S / m.G / 92)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#hc)"/><path d="${p.heart}" fill="none" stroke="#fff" stroke-width="${f(.9 * S / m.G)}"/><path d="${p.heart}" fill="none" stroke="${o.dot}" stroke-width="${f(.35 * S / m.G)}"/>`
              : `<path d="${p.heart}" fill="#2b1b17"/>`) + '</svg>';              // cœur central (photo ou noir)
    }                                                                               // fin toSVG

    function scannable(m, url, o) {                                                 // VÉRIFICATION avec jsQR
      for (const S of [720, 420]) {                                                 // à deux tailles (grand et petit)
        const c = document.createElement('canvas'); c.width = c.height = S;         // canvas de test
        const x = c.getContext('2d', { willReadFrequently: true });                 // contexte
        draw(x, m, S, { ...o, bg: 'white' });                                       // toujours sur blanc (comme imprimé)
        const res = jsQR(x.getImageData(0, 0, S, S).data, S, S, { inversionAttempts: 'dontInvert' }); // décodage
        if (!res || res.data !== url) return false;                                // illisible ou mauvais contenu
      }                                                                             // fin tailles
      return true;                                                                  // lisible
    }                                                                               // fin scannable

    const lum = hex => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }; // luminance d'une couleur
    const frame = () => new Promise(r => setTimeout(r, 0));                         // laisse respirer l'interface

    async function generate() {                                                     // génère + vérifie + ajuste
      const url = $('url').value.trim();                                            // URL saisie
      if (!url) { status.textContent = '✏️ Colle d\'abord l\'adresse de ton site en ligne.'; return; } // champ vide
      if (typeof qrcode === 'undefined' || typeof jsQR === 'undefined') { status.textContent = '⚠️ Bibliothèques non chargées : vérifie ta connexion Internet.'; return; } // CDN absent
      opts = { dot: $('dot').value, bg: $('bg').value, img: centerImg };           // options (+ photo centrale)
      $('png').disabled = $('svg').disabled = true;                                 // bloque les exports
      status.textContent = '⏳ Calcul et vérification…';                            // attente
      if (typeof qrcode.stringToBytesFuncs === 'object' && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; // accents en UTF-8
      let v0;                                                                       // plus petite version possible
      try { const b = qrcode(0, 'H'); b.addData(url, 'Byte'); b.make(); v0 = (b.getModuleCount() - 17) / 4; } // auto
      catch (e) { status.textContent = '❌ Adresse trop longue pour un QR code.'; return; } // trop long
      const pads = [.2, .26, .32, .4, .5, .62];                                     // marges essayées (de la plus « cœur » à la plus sûre)
      const versions = [v0, v0 + 1, v0 + 2].filter(v => v <= 40);                   // versions essayées
      const decors = $('decor').checked ? [true, false] : [false];                  // avec puis sans décor
      const cws = centerImg ? [.3, .26, .22, .18] : [.16];                          // taille du cœur central : photo la plus grande possible
      let chosen = null;                                                            // modèle retenu
      search: for (const cw of cws) for (const d of decors) for (const v of versions) for (let i = 0; i < pads.length; i++) { // ajustement automatique
        await frame();                                                              // garde la page fluide
        const m = build(url, v, pads[i], d, cw);                                        // essai
        if (!scannable(m, url, opts)) continue;                                     // illisible → essai suivant
        if (i + 1 < pads.length) { const m2 = build(url, v, pads[i + 1], d, cw); if (scannable(m2, url, opts)) { chosen = m2; break search; } } // marge de sécurité : un cran de plus si possible
        chosen = m; break search;                                                   // retenu
      }                                                                             // fin recherche
      const ok = !!chosen;                                                          // réussite ?
      model = chosen || build(url, v0, pads[pads.length - 1], false, cws[cws.length - 1]);               // sinon la version la plus sûre
      const S = Number($('size').value);                                            // taille d'export
      out.width = out.height = S;                                                   // redimensionne le canvas
      draw(out.getContext('2d'), model, S, opts);                                   // dessine
      status.textContent = ok ? '✅ Scannable' : '❌ Trop dégradé, augmente le niveau / la taille (ou choisis une couleur plus foncée).'; // verdict
      if (lum(opts.dot) > .45) status.textContent += ' ⚠️ Couleur claire : un rose plus foncé se scanne mieux.'; // alerte contraste
      info.textContent = `Version ${model.v} · correction H · marge ${model.pad} modules · ${(model.drop * 100).toFixed(1)} % des modules de données retirés par le cœur`; // détails
      $('png').disabled = $('svg').disabled = false;                                // active les exports
    }                                                                               // fin generate

    function download(blob, name) {                                                 // télécharge un fichier
      const a = document.createElement('a');                                        // lien temporaire
      a.href = URL.createObjectURL(blob); a.download = name;                        // fichier
      document.body.appendChild(a); a.click(); a.remove();                          // clic
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);                          // nettoyage
    }                                                                               // fin download

    $('form').addEventListener('submit', e => { e.preventDefault(); generate(); }); // Générer (bouton ou Entrée)
    $('png').addEventListener('click', () => out.toBlob(b => download(b, 'qr-coeur.png'), 'image/png')); // export PNG
    $('svg').addEventListener('click', () => model && download(new Blob([toSVG(model, Number($('size').value), opts)], { type: 'image/svg+xml' }), 'qr-coeur.svg')); // export SVG
    $('centerImg').addEventListener('change', () => {                              // une photo est choisie
      const file = $('centerImg').files[0]; if (!file) return;                   // annulé
      const fr = new FileReader();                                                  // lecture locale (aucun envoi)
      fr.onload = () => { const im = new Image(); im.onload = () => { centerImg = im; centerUrl = fr.result; $('centerClear').hidden = false; if ($('url').value.trim()) generate(); }; im.src = fr.result; }; // image prête → régénère
      fr.readAsDataURL(file);                                                       // adresse data: (utilisable dans le SVG)
    });                                                                             // fin choix photo
    $('centerClear').addEventListener('click', () => { centerImg = null; centerUrl = ""; $('centerImg').value = ""; $('centerClear').hidden = true; if (model) generate(); }); // retire la photo
    ['dot', 'bg', 'size', 'decor'].forEach(id => $(id).addEventListener('change', () => { if (model) generate(); })); // régénère si une option change
    if (/^https?:$/.test(location.protocol)) $('url').value = new URL('./', location.href).href; // en ligne : pré-remplit avec l'adresse du site
  })();                                                                             // fin du code
  </script>
</body>
</html>
